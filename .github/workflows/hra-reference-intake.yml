name: HRA reference source intake

# Source-only technical and local browser audit, no deployment or model artifact.
on:
  push:
    branches: [spike/anatomy-engine-v1]
    paths:
      - '.github/workflows/hra-reference-intake.yml'
      - 'model-audit/hra-*'
      - 'prototype/test/hra-*'
      - 'prototype/src/hra-*'
      - 'prototype/hra-candidate.*'
      - 'prototype/vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify and acquire fourteen exact pinned reference models and crosswalks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hra-intake/assets" "$RUNNER_TEMP/hra-intake/reports"
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/hra-intake/download.tsv"
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const load=name=>JSON.parse(readFileSync(`model-audit/${name}.json`,'utf8'));
          const manifest=load('hra-expanded-candidates');
          const original=load('hra-intake-candidates'),next=load('hra-next-candidates'),alternative=load('hra-lung-male-v1.3-candidate');
          const expected=new Map([...original.sources,...next.sources.filter(s=>s.id!=='lung-male'),...alternative.sources].map(s=>[s.id,s]));
          assert.equal(expected.size,14);
          assert.equal(manifest.sources.length,14);
          assert.equal(manifest.wave,'expanded');
          assert.equal(manifest.status,'CANDIDATE_INVENTORY_NOT_DOWNLOADED');
          assert.equal(manifest.source.commit,'27d6d493cd53761abb10f087767ec4cc74acb051');
          assert.equal(manifest.source.commit,original.source.commit);
          assert.equal(manifest.source.commit,next.source.commit);
          assert.equal(manifest.source.commit,alternative.source.commit);
          assert.equal(manifest.source.repository,'https://github.com/hubmapconsortium/hra-kg');
          for(const row of manifest.sources){
            assert.deepEqual(row,expected.get(row.id));
            assert(expected.delete(row.id));
            assert.match(row.version,/^v[0-9]+\.[0-9]+$/);
            for(const [kind,file] of [['glb',row.glb],['crosswalk',row.crosswalk]]){
              assert.match(file.filename,kind==='glb'?/^[a-z0-9-]+\.glb$/:/^crosswalk\.csv$/);
              assert.equal(file.localPath,`${row.id}/${file.filename}`);
              assert.equal(file.url,`https://raw.githubusercontent.com/hubmapconsortium/hra-kg/${manifest.source.commit}/digital-objects/ref-organ/${row.id}/${row.version}/raw/${file.filename}`);
              assert(Number.isSafeInteger(file.bytes)&&file.bytes>0&&file.bytes<25_000_000);
              assert.match(file.gitBlobSha1,/^[a-f0-9]{40}$/);
              console.log([file.url,file.localPath,file.bytes].join('\t'));
            }
          }
          assert.equal(expected.size,0);
          NODE
          while IFS=$'\t' read -r url path bytes; do
            mkdir -p "$RUNNER_TEMP/hra-intake/assets/$(dirname "$path")"
            curl --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 120 --max-filesize "$bytes" "$url" --output "$RUNNER_TEMP/hra-intake/assets/$path"
            test "$(wc -c < "$RUNNER_TEMP/hra-intake/assets/$path")" -eq "$bytes"
          done < "$RUNNER_TEMP/hra-intake/download.tsv"

      - name: Audit byte integrity, glTF nodes, and ontology crosswalks
        shell: bash
        run: |
          set -euo pipefail
          node model-audit/hra-reference-audit.mjs "$RUNNER_TEMP/hra-intake/assets" model-audit/hra-expanded-candidates.json "$RUNNER_TEMP/hra-intake/reports/audit.json" --expanded-wave

      - name: Stage exact audited original files only for the local candidate
        run: node model-audit/hra-stage-candidate.mjs "$RUNNER_TEMP/hra-intake/assets" model-audit/hra-expanded-candidates.json "$RUNNER_TEMP/hra-intake/reports/audit.json" prototype/public/hra-candidate --expanded-wave

      - name: Build local-only anatomical reference viewer
        run: npm ci && npm run build

      - name: Install the locked Chromium browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify fourteen actual HRA references in Chromium
        shell: bash
        env:
          SMOKE_SCREENSHOT_DIR: ${{ runner.temp }}/hra-intake/reports/browser-screenshots
        run: |
          set -euo pipefail
          npm run preview -- --port 4173 --strictPort > "$RUNNER_TEMP/hra-intake/reports/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/hra-candidate.html >/dev/null; then ready=1; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" = 1
          node prototype/test/hra-browser-smoke.mjs http://127.0.0.1:4173 | tee "$RUNNER_TEMP/hra-intake/reports/browser.log"

      - name: Preserve technical evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hra-reference-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/hra-intake/reports/
          if-no-files-found: ignore
          retention-days: 7
