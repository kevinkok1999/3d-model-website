name: HRA wave 3 nine source references

# Source-only audit. Never stage this geometry into the viewer; HOLD candidates
# are deliberately excluded before acquisition. Reports only, no GLB artifact.
on:
  push:
    branches: [spike/anatomy-engine-v1]
    paths:
      - '.github/workflows/hra-wave3-intake.yml'
      - 'model-audit/hra-wave3-candidates.json'
      - 'model-audit/hra-wave3-audit.mjs'
      - 'model-audit/hra-reference-audit.mjs'
      - 'prototype/test/hra-wave3-audit.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact inventory and HOLD exclusions
        run: node --test prototype/test/hra-wave3-audit.test.mjs
      - name: Acquire nine pinned source GLBs and crosswalks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hra-wave3/assets" "$RUNNER_TEMP/hra-wave3/reports"
          node model-audit/hra-wave3-audit.mjs --downloads model-audit/hra-wave3-candidates.json > "$RUNNER_TEMP/hra-wave3/download.tsv"
          while IFS=$'\t' read -r url path bytes; do
            mkdir -p "$RUNNER_TEMP/hra-wave3/assets/$(dirname "$path")"
            if ! curl --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 120 --max-filesize "$bytes" "$url" --output "$RUNNER_TEMP/hra-wave3/assets/$path"; then
              echo "Acquisition failed: $path (will be blocked by audit)"
            fi
          done < "$RUNNER_TEMP/hra-wave3/download.tsv"
      - name: Audit all nine selected source candidates independently
        shell: bash
        run: |
          set -euo pipefail
          node model-audit/hra-wave3-audit.mjs "$RUNNER_TEMP/hra-wave3/assets" model-audit/hra-wave3-candidates.json "$RUNNER_TEMP/hra-wave3/reports/audit.json"
      - name: Preserve technical evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hra-wave3-source-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/hra-wave3/reports/
          if-no-files-found: ignore
          retention-days: 7
