name: BodyParts3D wave 2 source intake

# Quarantined source-only audit, no binary artifacts, viewer or deployment.
on:
  push:
    branches: [spike/anatomy-engine-v1]
    paths:
      - '.github/workflows/bodyparts3d-wave2-intake.yml'
      - 'model-audit/bodyparts3d-wave2-audit.mjs'
      - 'model-audit/bodyparts3d-wave2-candidates.json'
      - 'model-audit/bodyparts3d-intake-candidates.json'
      - 'model-audit/bodyparts3d-obj-audit.py'
      - 'prototype/test/bodyparts3d-wave2-audit.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact metadata and fail-closed test cases
        run: node --test prototype/test/bodyparts3d-wave2-audit.test.mjs
      - name: Acquire official IS-A catalog and complete ELEMENT table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bodyparts-wave2/reports"
          for kind in isa_parts_list_e.txt isa_element_parts.txt; do
            if ! curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 120 --max-filesize 5000000 \
              "https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/$kind" --output "$RUNNER_TEMP/bodyparts-wave2/$kind"; then
              echo "Acquisition failed: $kind (metadata audit must fail closed)"
              # Keep no partially retrieved source table as valid evidence.
              mv "$RUNNER_TEMP/bodyparts-wave2/$kind" "$RUNNER_TEMP/bodyparts-wave2/$kind.incomplete" 2>/dev/null || true
            fi
          done
          node model-audit/bodyparts3d-wave2-audit.mjs "$RUNNER_TEMP/bodyparts-wave2/isa_parts_list_e.txt" "$RUNNER_TEMP/bodyparts-wave2/isa_element_parts.txt" "$RUNNER_TEMP/bodyparts-wave2/reports/metadata.json"
      - name: Acquire official archive for isolated geometry inspection
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 660 --max-filesize 200000000 \
            'https://dbarchive.biosciencedbc.jp/data/bodyparts3d/LATEST/isa_BP3D_4.0_obj_99.zip' \
            --output "$RUNNER_TEMP/bodyparts-wave2/isa_BP3D_4.0_obj_99.zip"; then
            echo 'Archive acquisition failed (geometry audit must report blocked)'
            mv "$RUNNER_TEMP/bodyparts-wave2/isa_BP3D_4.0_obj_99.zip" "$RUNNER_TEMP/bodyparts-wave2/archive.incomplete" 2>/dev/null || true
          fi
          python3 model-audit/bodyparts3d-obj-audit.py \
            "$RUNNER_TEMP/bodyparts-wave2/isa_BP3D_4.0_obj_99.zip" \
            model-audit/bodyparts3d-wave2-candidates.json \
            "$RUNNER_TEMP/bodyparts-wave2/reports/geometry.json"
      - name: Preserve source-only audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bodyparts3d-wave2-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/bodyparts-wave2/reports/
          if-no-files-found: ignore
          retention-days: 7
