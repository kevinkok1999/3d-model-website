name: HRA next ten reference sources

# Source-only audit. Never stage these candidate models into any viewer yet.
on:
  push:
    branches: [spike/anatomy-engine-v1]
    paths:
      - '.github/workflows/hra-next-source-intake.yml'
      - 'model-audit/hra-next-candidates.json'
      - 'model-audit/hra-reference-audit.mjs'
      - 'prototype/test/hra-next-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Acquire exact ten pinned source files and crosswalks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hra-next/assets" "$RUNNER_TEMP/hra-next/reports"
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/hra-next/download.tsv"
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest=JSON.parse(readFileSync('model-audit/hra-next-candidates.json','utf8'));
          const expected=new Set(['heart','liver','lung','small-intestine','spinal-cord'].flatMap(id=>['female','male'].map(variant=>`${id}-${variant}`)));
          assert.equal(manifest.sources.length,10);
          assert.match(manifest.source.commit,/^[a-f0-9]{40}$/);
          for(const row of manifest.sources){
            assert(expected.delete(row.id));
            assert.match(row.version,/^v[0-9]+\.[0-9]+$/);
            for(const [kind,file] of [['glb',row.glb],['crosswalk',row.crosswalk]]){
              assert.match(file.filename,kind==='glb'?/^[a-z0-9-]+\.glb$/:/^crosswalk\.csv$/);
              assert.equal(file.localPath,`${row.id}/${file.filename}`);
              assert.equal(file.url,`https://raw.githubusercontent.com/hubmapconsortium/hra-kg/${manifest.source.commit}/digital-objects/ref-organ/${row.id}/${row.version}/raw/${file.filename}`);
              assert(Number.isSafeInteger(file.bytes)&&file.bytes>0&&file.bytes<25_000_000);
              assert.match(file.gitBlobSha1,/^[a-f0-9]{40}$/);
              console.log([file.url,file.localPath,file.bytes].join('\t'));
            }
          }
          assert.equal(expected.size,0);
          NODE
          while IFS=$'\t' read -r url path bytes; do
            mkdir -p "$RUNNER_TEMP/hra-next/assets/$(dirname "$path")"
            if ! curl --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 120 --max-filesize "$bytes" "$url" --output "$RUNNER_TEMP/hra-next/assets/$path"; then
              echo "Acquisition failed: $path (will be blocked by the audit)"
            fi
          done < "$RUNNER_TEMP/hra-next/download.tsv"

      - name: Audit all ten source candidates independently
        shell: bash
        run: |
          set -euo pipefail
          node model-audit/hra-reference-audit.mjs "$RUNNER_TEMP/hra-next/assets" model-audit/hra-next-candidates.json "$RUNNER_TEMP/hra-next/reports/audit.json" --next-wave

      - name: Preserve technical evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hra-next-source-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/hra-next/reports/
          if-no-files-found: ignore
          retention-days: 7
