<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">3D Universe — desktop atlas bouwtekening</title>
  <desc id="desc">Concept van 1440 pixels breed met bovenbalk, breadcrumb, vijf modi, linker structuurnavigatie, centrale viewer en rechter detailpaneel. Silhouet is een schematische placeholder en geen anatomisch model.</desc>
